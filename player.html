<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Player - 2 in 1</title>
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: sans-serif;
        }
        .main-container {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }
        /* ប៊ូតុង Play នៅចំកណ្តាលអេក្រង់ */
        .custom-play-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 20;
            cursor: pointer;
        }
        .play-btn {
            background: #ff2d55;
            color: white;
            border: none;
            padding: 16px 32px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- វីដេអូ -->
        <video id="player" controls playsinline></video>

        <!-- ប៊ូតុងសម្រាប់ចុចចាប់ផ្តើម (Handles both Smart Link & Video Play) -->
        <div id="playOverlay" class="custom-play-overlay">
            <button class="play-btn">▶ ចុចទីនេះដើម្បីមើលវីដេអូ</button>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const videoUrl = params.get("video");
        const player = document.getElementById("player");
        const playOverlay = document.getElementById("playOverlay");

        if (videoUrl) {
            player.src = videoUrl;
        } else {
            document.body.innerHTML = "<h2 style='color:white;text-align:center;margin-top:40px;'>No Video Found</h2>";
        }

        playOverlay.addEventListener('click', function() {
            // ១. បើក Smart Link ក្នុងផ្ទាំងថ្មីស្វ័យប្រវត្តិ
            window.open('https://boring-active.com/7B6FQd', '_blank');

            // ២. លាក់ប៊ូតុងចុចនេះចេញ ដើម្បីឱ្យវីដេអូបង្ហាញ Controls ធម្មតា
            playOverlay.style.display = 'none';

            // ៣. បញ្ជាឱ្យវីដេអូចាប់ផ្តើមលេង
            player.play().catch(err => {
                console.log("Play error:", err);
            });
        });
    </script>
</body>
</html>
