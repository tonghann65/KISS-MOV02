<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Player - Test Photo</title>
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: sans-serif;
        }
        .main-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100vh;
            background: #000;
        }
        /* វីដេអូទំហំកន្លះអេក្រង់ (50vh) លេងស្វ័យប្រវត្តិ */
        video {
            width: 100%;
            height: 50vh;
            object-fit: contain;
            background: #000;
        }
        /* ផ្នែកសម្រាប់ដាក់រូបភាពចុចនៅខាងក្រោម */
        .banner-container {
            width: 100%;
            height: 50vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111;
            padding: 15px;
        }
        .banner-container a {
            display: block;
            width: 100%;
            max-width: 450px;
            height: 100%;
            max-height: 220px;
        }
        .banner-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- វីដេអូទំហំកន្លះអេក្រង់ លេងស្វ័យប្រវត្តិ -->
        <video id="player" controls autoplay muted playsinline></video>

        <!-- រូបភាព Test ឥតគិតថ្លៃសម្រាប់ចុចចូល Smart Link -->
        <div class="banner-container">
            <a href="https://boring-active.com/7B6FQd" target="_blank" rel="noopener noreferrer">
                <img src="https://i.imgur.com/HeBovha.png" alt="Test Banner">
            </a>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const videoUrl = params.get("video");
        const player = document.getElementById("player");

        if (videoUrl) {
            player.src = videoUrl;
            player.play().catch(error => {
                console.log("Autoplay prevented:", error);
            });
        } else {
            document.body.innerHTML = "<h2 style='color:white;text-align:center;margin-top:40px;'>No Video Found</h2>";
        }
    </script>
</body>
</html>
