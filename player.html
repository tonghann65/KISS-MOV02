    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Player with Smart Link</title>
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: sans-serif;
        }
        .main-container {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            height: 100vh;
            padding: 10px;
        }
        /* វីដេអូលេងនៅខាងលើ */
        video {
            width: 100%;
            flex: 1;
            object-fit: contain;
            background: #000;
            max-height: calc(100vh - 45px);
        }
        /* Smart Link ប្តូរមកជាតំណអត្ថបទ (Text Link) នៅខាងក្រោម */
        .smart-text-link {
            color: #b0b0b0;
            font-size: 14px;
            text-decoration: underline;
            padding: 5px;
            text-align: center;
            cursor: pointer;
        }
        .smart-text-link:hover {
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- វីដេអូលេងនៅខាងលើ -->
        <video id="player" controls autoplay muted playsinline></video>

        <!-- Smart Link ជាតំណអត្ថបទនៅខាងក្រោម -->
        <a href="https://boring-active.com/7B6FQd" target="_blank" class="smart-text-link">
            ▶️ មើលវីដេអូពេញ / Full Video
        </a>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const videoUrl = params.get("video");
        const player = document.getElementById("player");

        if (videoUrl) {
            player.src = videoUrl;
            player.play().catch(error => {
                console.log("Autoplay prevented:", error);
            });
        } else {
            document.body.innerHTML = "<h2 style='color:white;text-align:center;margin-top:40px;'>No Video Found</h2>";
        }
    </script>
</body>
</html>
