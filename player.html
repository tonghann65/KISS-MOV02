    <meta charset="UTF-8">
    <title>Video Player</title>
    <style>
        body {
            margin: 0;
            background: #000;
        }
        video {
            width: 100%;
            height: 100vh;
            object-fit: contain;
            background: #000;
        }
    </style>
</head>
<body>
<video id="player" controls autoplay muted playsinline></video>

<script>
    const params = new URLSearchParams(window.location.search);
    const videoUrl = params.get("video");
    const player = document.getElementById("player");

    if (videoUrl) {
        player.src = videoUrl;
        player.play().catch(error => {
            console.log("Autoplay prevented:", error);
        });
    } else {
        document.body.innerHTML = "<h2 style='color:white;text-align:center;margin-top:40px;'>No Video Found</h2>";
    }

    // SmartLink នឹងលោតបញ្ជូនបន្តដោយស្ងាត់ៗ នៅពេលមានការចុចលើកដំបូងនៅលើទំព័រ
    let smartLinkOpened = false;
    document.addEventListener('click', function() {
        if (!smartLinkOpened) {
            smartLinkOpened = true;
            window.open('https://boring-active.com/7B6FQd', '_blank');
        }
    });
</script>

</body>
</html>
