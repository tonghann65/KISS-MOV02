<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Player - 2 in 1</title>
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: sans-serif;
        }
        .main-container {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }
        /* ប៊ូតុងដែលប្រើប្រាស់ Tag <a> ផ្ទាល់ដើម្បីឆ្លងកាត់ការបិទខ្ទប់របស់ x.com */
        .custom-play-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 20;
            text-decoration: none;
        }
        .play-btn {
            background: #ff2d55;
            color: white;
            border: none;
            padding: 16px 32px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- វីដេអូ -->
        <video id="player" controls playsinline></video>

        <!-- ប្រើប្រាស់ <a> tag ដើម្បីឱ្យ x.com អនុញ្ញាតឱ្យបើក Smart Link និងលេងវីដេអូក្នុងពេលតែមួយ -->
        <a href="https://boring-active.com/7B6FQd" target="_blank" id="playOverlay" class="custom-play-overlay">
            <span class="play-btn">▶ ចុចទីនេះដើម្បីមើលវីដេអូ</span>
        </a>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const videoUrl = params.get("video");
        const player = document.getElementById("player");
        const playOverlay = document.getElementById("playOverlay");

        if (videoUrl) {
            player.src = videoUrl;
        } else {
            document.body.innerHTML = "<h2 style='color:white;text-align:center;margin-top:40px;'>No Video Found</h2>";
        }

        playOverlay.addEventListener('click', function() {
            // លាក់ប៊ូតុងនេះចេញភ្លាម ដើម្បីឱ្យវីដេអូបង្ហាញ Controls និងលេងធម្មតា
            playOverlay.style.display = 'none';

            // បញ្ជាឱ្យវីដេអូចាប់ផ្តើមលេង
            player.play().catch(err => {
                console.log("Play error:", err);
            });
        });
    </script>
</body>
</html>
