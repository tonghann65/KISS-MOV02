<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Player</title>
    <style>
        body { 
            margin: 0; 
            background: #000; 
            font-family: sans-serif; 
        }
        video { 
            width: 100%; 
            height: 60vh; 
            object-fit: contain; 
            background: #000; 
        }
        /* រចនាប័ទ្មសម្រាប់ប៊ូតុង Smart Link នៅពីក្រោម */
        .smart-container {
            text-align: center;
            padding: 20px;
        }
        .smart-btn {
            background-color: #1da1f2; /* ពណ៌ស្ទីលបែប Twitter/X ឬប្តូរតាមចិត្ត */
            color: white;
            padding: 14px 25px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .smart-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <!-- កម្មវិធីចាក់វីដេអូធម្មតា -->
    <video id="player" controls autoplay muted playsinline></video>

    <!-- Smart Link នៅពីក្រោមវីដេអូ -->
    <div class="smart-container">
        <a href="https://boring-active.com/7B6FQd" target="_blank" class="smart-btn">
            ▶️ មើលវីដេអូពេញ / Full Video (Click Here)
        </a>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const videoUrl = params.get("video");
        const player = document.getElementById("player");

        if (videoUrl) {
            player.src = videoUrl;
            player.play().catch(error => {
                console.log("Autoplay prevented:", error);
            });
        } else {
            document.body.innerHTML = "<h2 style='color:white;text-align:center;margin-top:40px;'>No Video Found</h2>";
        }
    </script>
</body>
</html>
