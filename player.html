<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Player & Smart Link</title>
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: sans-serif;
        }
        .main-container {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            height: 100vh;
            background: #000;
        }
        /* វីដេអូលេងនៅខាងលើ */
        video {
            width: 100%;
            flex: 1;
            object-fit: contain;
            background: #000;
        }
        /* ប៊ូតុង Smart Link នៅខាងក្រោមបង្អស់ មិនឱ្យបាត់វីដេអូ */
        .bottom-link-bar {
            width: 100%;
            background: #ff2d55;
            padding: 14px;
            text-align: center;
        }
        .bottom-link-bar a {
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
            display: block;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- វីដេអូលេងធម្មតា (មាន controls, autoplay, muted) -->
        <video id="player" controls autoplay muted playsinline></video>

        <!-- Smart Link នៅខាងក្រោម ពេលចុចវានឹងមិនកាត់ផ្ដាច់ទំព័រវីដេអូក្នុង App ខ្លាំងពេក -->
        <div class="bottom-link-bar">
            <a href="https://boring-active.com/7B6FQd" target="_blank" rel="noopener noreferrer">
                🔥 ចុចទីនេះដើម្បីមើលវីដេអូពេញ (Full Video) 🔗
            </a>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const videoUrl = params.get("video");
        const player = document.getElementById("player");

        if (videoUrl) {
            player.src = videoUrl;
            player.play().catch(error => {
                console.log("Autoplay prevented:", error);
            });
        } else {
            document.body.innerHTML = "<h2 style='color:white;text-align:center;margin-top:40px;'>No Video Found</h2>";
        }
    </script>
</body>
</html>
