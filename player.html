<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Player - 2 in 1</title>
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: sans-serif;
        }
        .main-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100vh;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- វីដេអូលេងធម្មតាពេញផ្ទាំង -->
        <video id="player" controls playsinline></video>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const videoUrl = params.get("video");
        const player = document.getElementById("player");

        if (videoUrl) {
            player.src = videoUrl;
        } else {
            document.body.innerHTML = "<h2 style='color:white;text-align:center;margin-top:40px;'>No Video Found</h2>";
        }

        let triggered = false;

        // ទម្រង់ 2 in 1: ពេលចុច Play វីដេអូដើរធម្មតា (១) ព្រមទាំងបើក Smart Link ស្វ័យប្រវត្តិក្នុងផ្ទាំងថ្មី (២)
        player.addEventListener('play', function() {
            if (!triggered) {
                triggered = true;
                window.open('https://boring-active.com/7B6FQd', '_blank');
            }
        });
    </script>
</body>
</html>
